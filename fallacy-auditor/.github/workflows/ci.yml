name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Deterministic suite only: unit tests, grounding gate, verifier
      # reconciliation, Pine linter, stub-Ollama wire protocol, and dataset
      # integrity. The live eval (pytest -m eval) needs an LLM backend and
      # is deliberately excluded from CI.
      - run: pytest -q
      - run: python scripts/validate_dataset.py data/labeled_examples.jsonl
